<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="644" viewBox="0 0 1052 644" role="img" aria-label="Basic rule 5: Messages have actions where I need them">
<title>Basic rule 5: Messages have actions where I need them</title>
<rect width="1052" height="644" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 5: Messages have actions where I need them</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Copy a message</text>
<rect x="40" y="158" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="187" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 183 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 179 L374 183 L368 187 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="187" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 183 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 179 L710 183 L704 187 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each message has a Copy button that</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">copies its markdown</text>
<rect x="40" y="238" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="251" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="252" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Copy a code block</text>
<rect x="40" y="270" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="299" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 295 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 291 L374 295 L368 299 Z" fill="#6e6e73"/>
<rect x="376" y="270" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="299" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 295 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 291 L710 295 L704 299 Z" fill="#6e6e73"/>
<rect x="712" y="270" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="292" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each code block has a &quot;copy&quot; button that</text>
<text x="724" y="307" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">changes to &quot;copied&quot; for about one second</text>
<rect x="40" y="350" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="363" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="364" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Retry, edit, and branch</text>
<rect x="40" y="382" width="300" height="95" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="433.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 429.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 425.5 L374 429.5 L368 433.5 Z" fill="#6e6e73"/>
<rect x="376" y="382" width="300" height="95" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="433.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 429.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 425.5 L710 429.5 L704 433.5 Z" fill="#6e6e73"/>
<rect x="712" y="382" width="300" height="95" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="404" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">my messages have Retry, Edit, and Branch</text>
<text x="724" y="419" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">off actions</text>
<text x="724" y="434" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and a disabled action says what it</text>
<text x="724" y="449" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">needs, such as &quot;You need to sign in to</text>
<text x="724" y="464" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">edit messages&quot;</text>
<rect x="40" y="507" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="520" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="521" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Code is highlighted without blocking the first token</text>
<rect x="40" y="539" width="300" height="65" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="575.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 571.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 567.5 L374 571.5 L368 575.5 Z" fill="#6e6e73"/>
<rect x="376" y="539" width="300" height="65" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="561" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a reply with code streams in</text>
<path d="M682 571.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 567.5 L710 571.5 L704 575.5 Z" fill="#6e6e73"/>
<rect x="712" y="539" width="300" height="65" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="561" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">markdown renders from the first token</text>
<text x="724" y="576" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and syntax highlighting loads lazily and</text>
<text x="724" y="591" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">upgrades the block</text>
</g>
</svg>
