<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1227" viewBox="0 0 1052 1227" role="img" aria-label="Basic rule 1: Scroll follows the reader, never the stream">
<title>Basic rule 1: Scroll follows the reader, never the stream</title>
<rect width="1052" height="1227" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 1: Scroll follows the reader, never the stream</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Following the stream while at the bottom</text>
<rect x="40" y="158" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I am within 80 px of the bottom of the</text>
<text x="52" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">transcript</text>
<path d="M346 198 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 194 L374 198 L368 202 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">new tokens arrive</text>
<path d="M682 198 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 194 L710 198 L704 202 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the transcript stays pinned to the</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">newest line</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the pin uses an instant jump, not a</text>
<text x="724" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">smooth animation</text>
<rect x="40" y="268" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="281" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="282" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Reading history while the agent streams</text>
<rect x="40" y="300" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I scrolled up more than 80 px from the</text>
<text x="52" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">bottom</text>
<path d="M346 340 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 336 L374 340 L368 344 Z" fill="#6e6e73"/>
<rect x="376" y="300" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">new tokens, tool rows, or messages</text>
<text x="388" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">arrive</text>
<path d="M682 340 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 336 L710 340 L704 344 Z" fill="#6e6e73"/>
<rect x="712" y="300" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">my scroll position does not move by a</text>
<text x="724" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">single pixel</text>
<text x="724" y="352" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and content added above my viewport does</text>
<text x="724" y="367" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">not push what I am reading</text>
<rect x="40" y="410" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="423" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="424" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A scroll-wheel up releases the pin at once</text>
<rect x="40" y="442" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="464" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the transcript is pinned and streaming</text>
<path d="M346 467 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 463 L374 467 L368 471 Z" fill="#6e6e73"/>
<rect x="376" y="442" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="464" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I scroll up with the wheel or trackpad</text>
<path d="M682 467 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 463 L710 467 L704 471 Z" fill="#6e6e73"/>
<rect x="712" y="442" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="464" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">following stops on that event, before</text>
<text x="724" y="479" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the next token arrives</text>
<rect x="40" y="522" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="535" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="536" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A way back to the newest message</text>
<rect x="40" y="554" width="300" height="125" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="576" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I am not at the bottom</text>
<path d="M346 616.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 612.5 L374 616.5 L368 620.5 Z" fill="#6e6e73"/>
<rect x="376" y="554" width="300" height="125" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="576" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I press it</text>
<path d="M682 616.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 612.5 L710 616.5 L704 620.5 Z" fill="#6e6e73"/>
<rect x="712" y="554" width="300" height="125" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="576" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a &quot;Scroll to latest&quot; button is visible</text>
<text x="724" y="591" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">above the composer</text>
<text x="724" y="606" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and it shows a count of unread messages</text>
<text x="724" y="621" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">that arrived while I was away</text>
<text x="724" y="636" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">then the transcript scrolls to the</text>
<text x="724" y="651" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">bottom and following resumes</text>
<text x="724" y="666" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the unread count resets to zero</text>
<rect x="40" y="709" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="722" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="723" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Opening a conversation lands at the bottom</text>
<rect x="40" y="741" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="785" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 781 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 777 L374 781 L368 785 Z" fill="#6e6e73"/>
<rect x="376" y="741" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="763" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I open an existing conversation</text>
<path d="M682 781 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 777 L710 781 L704 785 Z" fill="#6e6e73"/>
<rect x="712" y="741" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="763" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the newest message is visible when the</text>
<text x="724" y="778" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">loading state disappears</text>
<text x="724" y="793" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and I never see the transcript scroll</text>
<text x="724" y="808" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">down from the top</text>
<rect x="40" y="851" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="864" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="865" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">Older history pages in without a jump</text>
<rect x="40" y="883" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I scroll within 200 px of the top</text>
<path d="M346 908 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 904 L374 908 L368 912 Z" fill="#6e6e73"/>
<rect x="376" y="883" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">an older page of history loads</text>
<path d="M682 908 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 904 L710 908 L704 912 Z" fill="#6e6e73"/>
<rect x="712" y="883" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">my scroll position is kept relative to</text>
<text x="724" y="920" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the message I was reading</text>
<rect x="40" y="963" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="976" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="977" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">An existing conversation never flashes the empty state</text>
<rect x="40" y="995" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1039" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1035 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1031 L374 1035 L368 1039 Z" fill="#6e6e73"/>
<rect x="376" y="995" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1017" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I open the address of a conversation</text>
<text x="388" y="1032" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">that has messages</text>
<path d="M682 1035 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1031 L710 1035 L704 1039 Z" fill="#6e6e73"/>
<rect x="712" y="995" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1017" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a loading state shows until the messages</text>
<text x="724" y="1032" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">arrive</text>
<text x="724" y="1047" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the empty state with starters never</text>
<text x="724" y="1062" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">appears, not even for one frame</text>
<rect x="40" y="1105" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="1118" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="1119" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">My own message always pins</text>
<rect x="40" y="1137" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1166" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1162 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1158 L374 1162 L368 1166 Z" fill="#6e6e73"/>
<rect x="376" y="1137" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1159" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I send a message</text>
<path d="M682 1162 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1158 L710 1162 L704 1166 Z" fill="#6e6e73"/>
<rect x="712" y="1137" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1159" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the transcript scrolls to the bottom,</text>
<text x="724" y="1174" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">even if I had scrolled up</text>
</g>
</svg>
