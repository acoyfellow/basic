<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1244" viewBox="0 0 1052 1244" role="img" aria-label="Basic rule 3: A running turn is visible, timed, and stoppable">
<title>Basic rule 3: A running turn is visible, timed, and stoppable</title>
<rect width="1052" height="1244" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 3: A running turn is visible, timed, and stoppable</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Send becomes Stop</text>
<rect x="40" y="158" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="202" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 198 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 194 L374 198 L368 202 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a turn starts</text>
<path d="M682 198 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 194 L710 198 L704 202 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the Send button becomes a Stop button</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">labelled &quot;Cancel message&quot;</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the composer stays usable so I can</text>
<text x="724" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">draft the next message</text>
<rect x="40" y="268" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="281" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="282" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Esc stops the agent</text>
<rect x="40" y="300" width="300" height="40" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a turn is running and no modal is open</text>
<path d="M346 320 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 316 L374 320 L368 324 Z" fill="#6e6e73"/>
<rect x="376" y="300" width="300" height="40" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I press Esc</text>
<path d="M682 320 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 316 L710 320 L704 324 Z" fill="#6e6e73"/>
<rect x="712" y="300" width="300" height="40" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the turn is cancelled</text>
<rect x="40" y="370" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="383" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="384" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A thinking indicator appears only when it is needed</text>
<rect x="40" y="402" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="446" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 442 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 438 L374 442 L368 446 Z" fill="#6e6e73"/>
<rect x="376" y="402" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="424" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a turn starts and no token has arrived</text>
<text x="388" y="439" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">yet</text>
<path d="M682 442 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 438 L710 442 L704 446 Z" fill="#6e6e73"/>
<rect x="712" y="402" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="424" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a thinking indicator appears after a</text>
<text x="724" y="439" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">short delay, not on a fast reply</text>
<text x="724" y="454" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and it is announced politely to screen</text>
<text x="724" y="469" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">readers</text>
<rect x="40" y="512" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="525" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<rect x="86.4" y="512" width="47" height="18" rx="9" fill="#f1ecff" stroke="#7a5af5"/><text x="109.9" y="525" font-size="11" font-weight="600" fill="#4b2fc0" text-anchor="middle">agent</text>
<text x="145.4" y="526" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Each tool call shows a live timer</text>
<rect x="40" y="544" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="566" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a tool call is running</text>
<path d="M346 584 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 580 L374 584 L368 588 Z" fill="#6e6e73"/>
<rect x="376" y="544" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="588" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 584 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 580 L710 584 L704 588 Z" fill="#6e6e73"/>
<rect x="712" y="544" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="566" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">its row shows the elapsed time, updated</text>
<text x="724" y="581" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">every second</text>
<text x="724" y="596" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the timer stops at the final value</text>
<text x="724" y="611" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">when the call ends</text>
<rect x="40" y="654" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="667" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<rect x="86.4" y="654" width="47" height="18" rx="9" fill="#f1ecff" stroke="#7a5af5"/><text x="109.9" y="667" font-size="11" font-weight="600" fill="#4b2fc0" text-anchor="middle">agent</text>
<text x="145.4" y="668" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">The whole task shows a live timer</text>
<rect x="40" y="686" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="708" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a turn has been running for longer than</text>
<text x="52" y="723" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a minute</text>
<path d="M346 726 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 722 L374 726 L368 730 Z" fill="#6e6e73"/>
<rect x="376" y="686" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="730" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 726 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 722 L710 726 L704 730 Z" fill="#6e6e73"/>
<rect x="712" y="686" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="708" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page shows how long the whole task</text>
<text x="724" y="723" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">has run, such as &quot;task 4m 12s&quot;</text>
<text x="724" y="738" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the browser tab title shows that it</text>
<text x="724" y="753" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">is working</text>
<rect x="40" y="796" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="809" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<rect x="86.4" y="796" width="47" height="18" rx="9" fill="#f1ecff" stroke="#7a5af5"/><text x="109.9" y="809" font-size="11" font-weight="600" fill="#4b2fc0" text-anchor="middle">agent</text>
<text x="145.4" y="810" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A stuck tool row never runs forever</text>
<rect x="40" y="828" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="850" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a turn ended without a result for a tool</text>
<path d="M346 853 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 849 L374 853 L368 857 Z" fill="#6e6e73"/>
<rect x="376" y="828" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="857" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 853 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 849 L710 853 L704 857 Z" fill="#6e6e73"/>
<rect x="712" y="828" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="850" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the tool row shows an error, not a timer</text>
<text x="724" y="865" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">that climbs forever</text>
<rect x="40" y="908" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="921" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="922" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A turn that ends with nothing visible says so</text>
<rect x="40" y="940" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="969" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 965 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 961 L374 965 L368 969 Z" fill="#6e6e73"/>
<rect x="376" y="940" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="962" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the agent finishes without visible</text>
<text x="388" y="977" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">output</text>
<path d="M682 965 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 961 L710 965 L704 969 Z" fill="#6e6e73"/>
<rect x="712" y="940" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="962" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I am told &quot;Agent completed without a</text>
<text x="724" y="977" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">visible response. Please retry.&quot;</text>
<rect x="40" y="1020" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="1033" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<rect x="86.4" y="1020" width="47" height="18" rx="9" fill="#f1ecff" stroke="#7a5af5"/><text x="109.9" y="1033" font-size="11" font-weight="600" fill="#4b2fc0" text-anchor="middle">agent</text>
<text x="145.4" y="1034" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Reasoning is folded</text>
<rect x="40" y="1052" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1081" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1077 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1073 L374 1077 L368 1081 Z" fill="#6e6e73"/>
<rect x="376" y="1052" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1074" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the reply includes reasoning</text>
<path d="M682 1077 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1073 L710 1077 L704 1081 Z" fill="#6e6e73"/>
<rect x="712" y="1052" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1074" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">it sits in a closed &quot;Thinking&quot;</text>
<text x="724" y="1089" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">disclosure above the answer</text>
<rect x="40" y="1132" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="1145" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="1146" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">Tool rows keep their open or closed state while streaming</text>
<rect x="40" y="1164" width="300" height="40" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="1186" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I opened a tool row</text>
<path d="M346 1184 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1180 L374 1184 L368 1188 Z" fill="#6e6e73"/>
<rect x="376" y="1164" width="300" height="40" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1186" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the stream re-renders the message</text>
<path d="M682 1184 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1180 L710 1184 L704 1188 Z" fill="#6e6e73"/>
<rect x="712" y="1164" width="300" height="40" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1186" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">that row stays open</text>
</g>
</svg>
