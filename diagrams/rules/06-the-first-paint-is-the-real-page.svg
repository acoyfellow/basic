<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="323" viewBox="0 0 1052 323" role="img" aria-label="Basic rule 6: The first paint is the real page">
<title>Basic rule 6: The first paint is the real page</title>
<rect width="1052" height="323" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 6: The first paint is the real page</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Opening the app shows my real page at once</text>
<rect x="40" y="158" width="300" height="125" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="224.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 220.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 216.5 L374 220.5 L368 224.5 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="125" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I open the app, or reload an open chat</text>
<path d="M682 220.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 216.5 L710 220.5 L704 224.5 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="125" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the first paint already shows my chats,</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">my name or greeting, and the open</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">transcript</text>
<text x="724" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and it never shows &quot;Connecting&quot; while</text>
<text x="724" y="240" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page loads</text>
<text x="724" y="255" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and nothing jumps from a generic page to</text>
<text x="724" y="270" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a personal one</text>
</g>
</svg>
