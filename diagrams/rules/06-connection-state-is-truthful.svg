<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="599" viewBox="0 0 1052 599" role="img" aria-label="Basic rule 6: Connection state is truthful">
<title>Basic rule 6: Connection state is truthful</title>
<rect width="1052" height="599" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 6: Connection state is truthful</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Reconnecting is shown, then gives up honestly</text>
<rect x="40" y="158" width="300" height="65" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="194.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 190.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 186.5 L374 190.5 L368 194.5 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="65" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the socket drops</text>
<text x="388" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">when reconnects keep failing</text>
<path d="M682 190.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 186.5 L710 190.5 L704 194.5 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="65" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page says &quot;Reconnecting&quot;</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">then the page says it is offline and</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">shows Retry, instead of spinning forever</text>
<rect x="40" y="253" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="266" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="267" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A stale close cannot undo a good connection</text>
<rect x="40" y="285" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="307" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a new socket already opened</text>
<path d="M346 310 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 306 L374 310 L368 314 Z" fill="#6e6e73"/>
<rect x="376" y="285" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="307" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the old socket's close event arrives</text>
<text x="388" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">late</text>
<path d="M682 310 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 306 L710 310 L704 314 Z" fill="#6e6e73"/>
<rect x="712" y="285" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="307" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the state stays connected</text>
<rect x="40" y="365" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="378" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="379" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A backgrounded tab catches up when it returns</text>
<rect x="40" y="397" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="419" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the tab was hidden while a turn finished</text>
<path d="M346 422 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 418 L374 422 L368 426 Z" fill="#6e6e73"/>
<rect x="376" y="397" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="419" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I return to the tab</text>
<path d="M682 422 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 418 L710 422 L704 426 Z" fill="#6e6e73"/>
<rect x="712" y="397" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="419" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page reconnects and shows the</text>
<text x="724" y="434" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">finished turn</text>
<rect x="40" y="477" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="490" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<rect x="86.4" y="477" width="47" height="18" rx="9" fill="#f1ecff" stroke="#7a5af5"/><text x="109.9" y="490" font-size="11" font-weight="600" fill="#4b2fc0" text-anchor="middle">agent</text>
<text x="145.4" y="491" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A turn interrupted by a restart resumes</text>
<rect x="40" y="509" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="531" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the server restarted mid tool call</text>
<path d="M346 534 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 530 L374 534 L368 538 Z" fill="#6e6e73"/>
<rect x="376" y="509" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="538" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 534 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 530 L710 534 L704 538 Z" fill="#6e6e73"/>
<rect x="712" y="509" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="531" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the turn resumes from its last</text>
<text x="724" y="546" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">checkpoint, and the transcript says so</text>
</g>
</svg>
