<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1232" viewBox="0 0 1052 1232" role="img" aria-label="Basic rule 8: Side panels fit the reader's screen">
<title>Basic rule 8: Side panels fit the reader's screen</title>
<rect width="1052" height="1232" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 8: Side panels fit the reader's screen</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A details pane opens for what I picked, and only then</text>
<rect x="40" y="158" width="300" height="110" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the app offers a pane beside the</text>
<text x="52" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">conversation for details</text>
<path d="M346 213 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 209 L374 213 L368 217 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="110" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">nothing has been picked</text>
<text x="388" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">when I open the details of a turn, a</text>
<text x="388" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">tool call or an attachment</text>
<path d="M682 213 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 209 L710 213 L704 217 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="110" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">no details pane or empty placeholder</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">takes width from the conversation</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">then a pane opens beside the</text>
<text x="724" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">conversation showing that item</text>
<text x="724" y="240" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and closing it gives the conversation</text>
<text x="724" y="255" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">its width back</text>
<rect x="40" y="298" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="311" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="312" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A side panel can be hidden and shown again</text>
<rect x="40" y="330" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="352" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page has a left or a right panel</text>
<text x="52" y="367" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">next to the conversation</text>
<text x="52" y="382" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and each panel has a visible toggle</text>
<text x="52" y="397" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">button with an accessible name</text>
<path d="M346 370 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 366 L374 370 L368 374 Z" fill="#6e6e73"/>
<rect x="376" y="330" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="352" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I press the toggle</text>
<path d="M682 370 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 366 L710 370 L704 374 Z" fill="#6e6e73"/>
<rect x="712" y="330" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="352" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel hides and the conversation</text>
<text x="724" y="367" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">takes its width</text>
<text x="724" y="382" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and pressing the toggle again brings the</text>
<text x="724" y="397" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">panel back at the width it had</text>
<rect x="40" y="440" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="453" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="454" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A side panel can be resized on desktop</text>
<rect x="40" y="472" width="300" height="95" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="494" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a side panel is open on a desktop-width</text>
<text x="52" y="509" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">screen</text>
<path d="M346 519.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 515.5 L374 519.5 L368 523.5 Z" fill="#6e6e73"/>
<rect x="376" y="472" width="300" height="95" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="494" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I drag the edge between the panel and</text>
<text x="388" y="509" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the conversation</text>
<path d="M682 519.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 515.5 L710 519.5 L704 523.5 Z" fill="#6e6e73"/>
<rect x="712" y="472" width="300" height="95" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="494" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel width follows the pointer</text>
<text x="724" y="509" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and it stops at a minimum and a maximum</text>
<text x="724" y="524" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">width</text>
<text x="724" y="539" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the conversation never gets narrower</text>
<text x="724" y="554" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">than a readable minimum</text>
<rect x="40" y="597" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="610" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="611" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Panel sizes and visibility survive a reload</text>
<rect x="40" y="629" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="651" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I resized or hid a side panel</text>
<path d="M346 654 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 650 L374 654 L368 658 Z" fill="#6e6e73"/>
<rect x="376" y="629" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="651" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I reload the page</text>
<path d="M682 654 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 650 L710 654 L704 658 Z" fill="#6e6e73"/>
<rect x="712" y="629" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="651" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each panel has the same width and the</text>
<text x="724" y="666" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">same visibility</text>
<rect x="40" y="709" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="722" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="723" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">What is inside a panel adapts to its width</text>
<rect x="40" y="741" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="785" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 781 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 777 L374 781 L368 785 Z" fill="#6e6e73"/>
<rect x="376" y="741" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="763" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a side panel or the conversation is</text>
<text x="388" y="778" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">resized to any allowed width</text>
<path d="M682 781 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 777 L710 781 L704 785 Z" fill="#6e6e73"/>
<rect x="712" y="741" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="763" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">nothing inside it overflows sideways or</text>
<text x="724" y="778" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">is cut off</text>
<text x="724" y="793" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and controls that no longer fit move</text>
<text x="724" y="808" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">into a menu or wrap</text>
<rect x="40" y="851" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="864" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="865" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">On a phone, side panels open over the conversation</text>
<rect x="40" y="883" width="300" height="95" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the screen is phone width</text>
<path d="M346 930.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 926.5 L374 930.5 L368 934.5 Z" fill="#6e6e73"/>
<rect x="376" y="883" width="300" height="95" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="934.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 930.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 926.5 L710 930.5 L704 934.5 Z" fill="#6e6e73"/>
<rect x="712" y="883" width="300" height="95" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">no side panel takes width from the</text>
<text x="724" y="920" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">conversation</text>
<text x="724" y="935" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and each panel opens from a button and</text>
<text x="724" y="950" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">covers the conversation until closed</text>
<text x="724" y="965" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and there is no drag edge</text>
<rect x="40" y="1008" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="1021" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="1022" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">Each panel toggle has a keyboard shortcut</text>
<rect x="40" y="1040" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1069" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1065 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1061 L374 1065 L368 1069 Z" fill="#6e6e73"/>
<rect x="376" y="1040" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="1069" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 1065 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1061 L710 1065 L704 1069 Z" fill="#6e6e73"/>
<rect x="712" y="1040" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1062" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each open side panel can be shown and</text>
<text x="724" y="1077" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">hidden with a documented shortcut</text>
<rect x="40" y="1120" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="1133" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="1134" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">A double click on the drag edge restores the default width</text>
<rect x="40" y="1152" width="300" height="40" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1176" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1172 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1168 L374 1172 L368 1176 Z" fill="#6e6e73"/>
<rect x="376" y="1152" width="300" height="40" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1174" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I double click the edge of a side panel</text>
<path d="M682 1172 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1168 L710 1172 L704 1176 Z" fill="#6e6e73"/>
<rect x="712" y="1152" width="300" height="40" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1174" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel returns to its default width</text>
</g>
</svg>
