<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1090" viewBox="0 0 1052 1090" role="img" aria-label="Basic rule 8: Side panels fit the reader's screen">
<title>Basic rule 8: Side panels fit the reader's screen</title>
<rect width="1052" height="1090" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 8: Side panels fit the reader's screen</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A side panel can be hidden and shown again</text>
<rect x="40" y="158" width="300" height="80" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the page has a left or a right panel</text>
<text x="52" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">next to the conversation</text>
<text x="52" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and each panel has a visible toggle</text>
<text x="52" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">button with an accessible name</text>
<path d="M346 198 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 194 L374 198 L368 202 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I press the toggle</text>
<path d="M682 198 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 194 L710 198 L704 202 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel hides and the conversation</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">takes its width</text>
<text x="724" y="210" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and pressing the toggle again brings the</text>
<text x="724" y="225" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">panel back at the width it had</text>
<rect x="40" y="268" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="281" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="282" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">A side panel can be resized on desktop</text>
<rect x="40" y="300" width="300" height="95" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a side panel is open on a desktop-width</text>
<text x="52" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">screen</text>
<path d="M346 347.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 343.5 L374 347.5 L368 351.5 Z" fill="#6e6e73"/>
<rect x="376" y="300" width="300" height="95" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I drag the edge between the panel and</text>
<text x="388" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the conversation</text>
<path d="M682 347.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 343.5 L710 347.5 L704 351.5 Z" fill="#6e6e73"/>
<rect x="712" y="300" width="300" height="95" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="322" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel width follows the pointer</text>
<text x="724" y="337" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and it stops at a minimum and a maximum</text>
<text x="724" y="352" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">width</text>
<text x="724" y="367" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and the conversation never gets narrower</text>
<text x="724" y="382" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">than a readable minimum</text>
<rect x="40" y="425" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="438" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="439" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Panel sizes and visibility survive a reload</text>
<rect x="40" y="457" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="479" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I resized or hid a side panel</text>
<path d="M346 482 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 478 L374 482 L368 486 Z" fill="#6e6e73"/>
<rect x="376" y="457" width="300" height="50" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="479" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I reload the page</text>
<path d="M682 482 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 478 L710 482 L704 486 Z" fill="#6e6e73"/>
<rect x="712" y="457" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="479" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each panel has the same width and the</text>
<text x="724" y="494" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">same visibility</text>
<rect x="40" y="537" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="550" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="551" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">What is inside a panel adapts to its width</text>
<rect x="40" y="569" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="613" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 609 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 605 L374 609 L368 613 Z" fill="#6e6e73"/>
<rect x="376" y="569" width="300" height="80" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="591" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">a side panel or the conversation is</text>
<text x="388" y="606" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">resized to any allowed width</text>
<path d="M682 609 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 605 L710 609 L704 613 Z" fill="#6e6e73"/>
<rect x="712" y="569" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="591" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">nothing inside it overflows sideways or</text>
<text x="724" y="606" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">is cut off</text>
<text x="724" y="621" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and controls that no longer fit move</text>
<text x="724" y="636" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">into a menu or wrap</text>
<rect x="40" y="679" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="692" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="693" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">On a phone, side panels open over the conversation</text>
<rect x="40" y="711" width="300" height="95" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="733" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the screen is phone width</text>
<path d="M346 758.5 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 754.5 L374 758.5 L368 762.5 Z" fill="#6e6e73"/>
<rect x="376" y="711" width="300" height="95" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="762.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 758.5 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 754.5 L710 758.5 L704 762.5 Z" fill="#6e6e73"/>
<rect x="712" y="711" width="300" height="95" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="733" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">no side panel takes width from the</text>
<text x="724" y="748" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">conversation</text>
<text x="724" y="763" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and each panel opens from a button and</text>
<text x="724" y="778" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">covers the conversation until closed</text>
<text x="724" y="793" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">and there is no drag edge</text>
<rect x="40" y="836" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="849" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="850" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">Each panel toggle has a keyboard shortcut</text>
<rect x="40" y="868" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="912" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 908 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 904 L374 908 L368 912 Z" fill="#6e6e73"/>
<rect x="376" y="868" width="300" height="80" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="912" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 908 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 904 L710 908 L704 912 Z" fill="#6e6e73"/>
<rect x="712" y="868" width="300" height="80" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="890" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">each side panel can be shown and hidden</text>
<text x="724" y="905" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">with a documented shortcut, such as</text>
<text x="724" y="920" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">Cmd+B for the left and Cmd+J for the</text>
<text x="724" y="935" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">right</text>
<rect x="40" y="978" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="991" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="992" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">A double click on the drag edge restores the default width</text>
<rect x="40" y="1010" width="300" height="40" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="1034" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 1030 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 1026 L374 1030 L368 1034 Z" fill="#6e6e73"/>
<rect x="376" y="1010" width="300" height="40" rx="8" fill="#fff1e6" stroke="#f38020"/>
<text x="388" y="1032" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">I double click the edge of a side panel</text>
<path d="M682 1030 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 1026 L710 1030 L704 1034 Z" fill="#6e6e73"/>
<rect x="712" y="1010" width="300" height="40" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="1032" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the panel returns to its default width</text>
</g>
</svg>
