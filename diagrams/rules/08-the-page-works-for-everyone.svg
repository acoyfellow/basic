<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="584" viewBox="0 0 1052 584" role="img" aria-label="Basic rule 8: The page works for everyone">
<title>Basic rule 8: The page works for everyone</title>
<rect width="1052" height="584" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Rule 8: The page works for everyone</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Each row is one scenario: the situation, what happens, and what must be true after.</text>
<text x="190" y="112" font-size="11" font-weight="700" fill="#a1a1a6" text-anchor="middle">GIVEN</text>
<text x="526" y="112" font-size="11" font-weight="700" fill="#f38020" text-anchor="middle">WHEN</text>
<text x="862" y="112" font-size="11" font-weight="700" fill="#2e9e5b" text-anchor="middle">THEN</text>
<rect x="40" y="126" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="139" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="140" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">The transcript is a polite live region</text>
<rect x="40" y="158" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="187" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 183 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 179 L374 183 L368 187 Z" fill="#6e6e73"/>
<rect x="376" y="158" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="187" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 183 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 179 L710 183 L704 187 Z" fill="#6e6e73"/>
<rect x="712" y="158" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="180" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the transcript is a log or</text>
<text x="724" y="195" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">aria-live=&quot;polite&quot; region with a heading</text>
<rect x="40" y="238" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="251" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="252" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Motion respects the system setting</text>
<rect x="40" y="270" width="300" height="50" rx="8" fill="#f5f5f7" stroke="#a1a1a6"/>
<text x="52" y="292" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">reduced motion is on</text>
<path d="M346 295 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 291 L374 295 L368 299 Z" fill="#6e6e73"/>
<rect x="376" y="270" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="299" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 295 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 291 L710 295 L704 299 Z" fill="#6e6e73"/>
<rect x="712" y="270" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="292" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">streaming, spinners, and smooth scrolls</text>
<text x="724" y="307" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">do not animate</text>
<rect x="40" y="350" width="40.4" height="18" rx="9" fill="#fff1e6" stroke="#f38020"/><text x="60.2" y="363" font-size="11" font-weight="600" fill="#9a4a00" text-anchor="middle">must</text>
<text x="92.4" y="364" font-size="14" font-weight="600" fill="#9a4a00" text-anchor="start">Every icon button has a name</text>
<rect x="40" y="382" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="411" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 407 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 403 L374 407 L368 411 Z" fill="#6e6e73"/>
<rect x="376" y="382" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="411" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 407 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 403 L710 407 L704 411 Z" fill="#6e6e73"/>
<rect x="712" y="382" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="404" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">every icon-only button has an accessible</text>
<text x="724" y="419" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">label</text>
<rect x="40" y="462" width="53.599999999999994" height="18" rx="9" fill="#eef4ff" stroke="#4a7bd8"/><text x="66.8" y="475" font-size="11" font-weight="600" fill="#1f4a99" text-anchor="middle">should</text>
<text x="105.6" y="476" font-size="14" font-weight="600" fill="#1f4a99" text-anchor="start">Notifications have a keyboard shortcut</text>
<rect x="40" y="494" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="190" y="523" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M346 519 H368" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M368 515 L374 519 L368 523 Z" fill="#6e6e73"/>
<rect x="376" y="494" width="300" height="50" rx="8" fill="none" stroke="#d2d2d7" stroke-dasharray="4 4"/>
<text x="526" y="523" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">no step</text>
<path d="M682 519 H704" stroke="#6e6e73" stroke-width="1.5"/>
<path d="M704 515 L710 519 L704 523 Z" fill="#6e6e73"/>
<rect x="712" y="494" width="300" height="50" rx="8" fill="#e9f7ef" stroke="#2e9e5b"/>
<text x="724" y="516" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">the notification region is reachable</text>
<text x="724" y="531" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">with a documented shortcut such as Alt+T</text>
</g>
</svg>
