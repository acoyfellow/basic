<text x="24" y="32" class="title">tenon: nine rules, five apps</text>
<text x="24" y="52" class="sub">Static probes from basic/kernel. A cell is a place to read, not proof. Generated 2026-10-19.</text>
<text x="616" y="86" class="app">coil</text><text x="616" y="106" class="score">7/9</text><text x="728" y="86" class="app">hark</text><text x="728" y="106" class="score">8/9</text><text x="840" y="86" class="app">my-ax</text><text x="840" y="106" class="score">8/9</text><text x="952" y="86" class="app">chat-ax</text><text x="952" y="106" class="score">4/9</text><text x="1064" y="86" class="app">skin</text><text x="1064" y="106" class="score">8/9</text><text x="24" y="145" class="rule"><tspan class="id">T1</tspan> Every non-public request has a verified owner</text><g class="cell" data-app="coil" data-id="T1" data-verdict="has"><title>coil T1: has</title><rect x="564" y="124" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="145" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T1" data-verdict="has"><title>hark T1: has</title><rect x="676" y="124" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="145" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T1" data-verdict="has"><title>my-ax T1: has</title><rect x="788" y="124" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="145" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T1" data-verdict="has"><title>chat-ax T1: has</title><rect x="900" y="124" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="952" y="145" class="verdict">has</text></g><g class="cell" data-app="skin" data-id="T1" data-verdict="has"><title>skin T1: has</title><rect x="1012" y="124" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="145" class="verdict">has</text></g><text x="24" y="185" class="rule"><tspan class="id">T2</tspan> State lives in a Durable Object keyed by that owner</text><g class="cell" data-app="coil" data-id="T2" data-verdict="has"><title>coil T2: has</title><rect x="564" y="164" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="185" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T2" data-verdict="has"><title>hark T2: has</title><rect x="676" y="164" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="185" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T2" data-verdict="has"><title>my-ax T2: has</title><rect x="788" y="164" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="185" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T2" data-verdict="has"><title>chat-ax T2: has</title><rect x="900" y="164" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="952" y="185" class="verdict">has</text></g><g class="cell" data-app="skin" data-id="T2" data-verdict="has"><title>skin T2: has</title><rect x="1012" y="164" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="185" class="verdict">has</text></g><text x="24" y="225" class="rule"><tspan class="id">T3</tspan> The payer is explicit, and a user payer never falls back to host inference</text><g class="cell" data-app="coil" data-id="T3" data-verdict="partial"><title>coil T3: partial (routes to the user account (coil/src/auth/oauth.ts:197) and also calls host AI (coil/src/thread.ts:299); confirm the host call never serves a user-paid turn)</title><rect x="564" y="204" width="104" height="32" rx="6" fill="#fff3bf" stroke="#e8a200"/><text x="616" y="225" class="verdict">partial</text></g><g class="cell" data-app="hark" data-id="T3" data-verdict="has"><title>hark T3: has</title><rect x="676" y="204" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="225" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T3" data-verdict="partial"><title>my-ax T3: partial (routes to the user account (my-ax/src/routes/browser.ts:6) and also calls host AI (my-ax/src/index.tsx:77); confirm the host call never serves a user-paid turn)</title><rect x="788" y="204" width="104" height="32" rx="6" fill="#fff3bf" stroke="#e8a200"/><text x="840" y="225" class="verdict">partial</text></g><g class="cell" data-app="chat-ax" data-id="T3" data-verdict="partial"><title>chat-ax T3: partial</title><rect x="900" y="204" width="104" height="32" rx="6" fill="#fff3bf" stroke="#e8a200"/><text x="952" y="225" class="verdict">partial</text></g><g class="cell" data-app="skin" data-id="T3" data-verdict="has"><title>skin T3: has</title><rect x="1012" y="204" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="225" class="verdict">has</text></g><text x="24" y="265" class="rule"><tspan class="id">T4</tspan> Secrets and grant tokens never reach the browser or a log</text><g class="cell" data-app="coil" data-id="T4" data-verdict="has"><title>coil T4: has</title><rect x="564" y="244" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="265" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T4" data-verdict="has"><title>hark T4: has</title><rect x="676" y="244" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="265" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T4" data-verdict="has"><title>my-ax T4: has</title><rect x="788" y="244" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="265" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T4" data-verdict="has"><title>chat-ax T4: has</title><rect x="900" y="244" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="952" y="265" class="verdict">has</text></g><g class="cell" data-app="skin" data-id="T4" data-verdict="has"><title>skin T4: has</title><rect x="1012" y="244" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="265" class="verdict">has</text></g><text x="24" y="305" class="rule"><tspan class="id">T5</tspan> Writes must come from the app origin</text><g class="cell" data-app="coil" data-id="T5" data-verdict="has"><title>coil T5: has</title><rect x="564" y="284" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="305" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T5" data-verdict="has"><title>hark T5: has</title><rect x="676" y="284" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="305" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T5" data-verdict="has"><title>my-ax T5: has</title><rect x="788" y="284" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="305" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T5" data-verdict="missing"><title>chat-ax T5: missing</title><rect x="900" y="284" width="104" height="32" rx="6" fill="#ffe3e3" stroke="#e03131"/><text x="952" y="305" class="verdict">missing</text></g><g class="cell" data-app="skin" data-id="T5" data-verdict="partial"><title>skin T5: partial</title><rect x="1012" y="284" width="104" height="32" rx="6" fill="#fff3bf" stroke="#e8a200"/><text x="1064" y="305" class="verdict">partial</text></g><text x="24" y="345" class="rule"><tspan class="id">T6</tspan> Agent-written code runs in an isolate with no ambient network or secrets</text><g class="cell" data-app="coil" data-id="T6" data-verdict="has"><title>coil T6: has</title><rect x="564" y="324" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="345" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T6" data-verdict="has"><title>hark T6: has</title><rect x="676" y="324" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="345" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T6" data-verdict="has"><title>my-ax T6: has</title><rect x="788" y="324" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="345" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T6" data-verdict="missing"><title>chat-ax T6: missing</title><rect x="900" y="324" width="104" height="32" rx="6" fill="#ffe3e3" stroke="#e03131"/><text x="952" y="345" class="verdict">missing</text></g><g class="cell" data-app="skin" data-id="T6" data-verdict="has"><title>skin T6: has</title><rect x="1012" y="324" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="345" class="verdict">has</text></g><text x="24" y="385" class="rule"><tspan class="id">T7</tspan> A run is visible, truthful, and stoppable</text><g class="cell" data-app="coil" data-id="T7" data-verdict="has"><title>coil T7: has</title><rect x="564" y="364" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="616" y="385" class="verdict">has</text></g><g class="cell" data-app="hark" data-id="T7" data-verdict="has"><title>hark T7: has</title><rect x="676" y="364" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="728" y="385" class="verdict">has</text></g><g class="cell" data-app="my-ax" data-id="T7" data-verdict="has"><title>my-ax T7: has</title><rect x="788" y="364" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="840" y="385" class="verdict">has</text></g><g class="cell" data-app="chat-ax" data-id="T7" data-verdict="has"><title>chat-ax T7: has</title><rect x="900" y="364" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="952" y="385" class="verdict">has</text></g><g class="cell" data-app="skin" data-id="T7" data-verdict="has"><title>skin T7: has</title><rect x="1012" y="364" width="104" height="32" rx="6" fill="#d6f5dd" stroke="#2f9e44"/><text x="1064" y="385" class="verdict">has</text></g><text x="24" y="425" class="rule"><tspan class="id">T8</tspan> Changes the agent makes are versioned, gated, and append-only</text><g class="cell" data-app="coil" data-id="T8" data-verdict="has"><titl